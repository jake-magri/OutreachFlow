name: Build and smoke tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OutreachFlow.slnx
      - name: Build
        run: dotnet build OutreachFlow.slnx --no-restore --configuration Release
      - name: Restore pinned EF Core tool
        run: dotnet tool restore
      - name: Ensure both EF models match the committed migration snapshots
        shell: bash
        run: |
          dotnet ef migrations has-pending-model-changes --context OutreachDbContext --project OutreachFlow/OutreachFlow.csproj --startup-project OutreachFlow/OutreachFlow.csproj
          dotnet ef migrations has-pending-model-changes --context AccountDbContext --project OutreachFlow/OutreachFlow.csproj --startup-project OutreachFlow/OutreachFlow.csproj
      - name: Smoke tests
        run: dotnet run --project OutreachFlow.SmokeTests/OutreachFlow.SmokeTests.csproj --configuration Release --no-build
      # Browser/real-site probes are opt-in local experiments. They must not run
      # implicitly as part of regular PR CI; see the test modernization backlog.
      - name: Launch local site and verify protected routes
        shell: bash
        run: |
          dotnet dev-certs https
          dotnet run --project OutreachFlow/OutreachFlow.csproj --no-build --configuration Release --launch-profile OutreachFlow > /tmp/outreachflow-startup.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --insecure --silent --fail https://localhost:7117/account/setup -o /tmp/setup.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/outreachflow-startup.log
            exit 1
          fi
          grep -q "Set up your owner account" /tmp/setup.html
          status=$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' https://localhost:7117/)
          if [ "$status" != "302" ]; then
            echo "Expected dashboard to redirect unauthenticated user, got: $status"
            cat /tmp/outreachflow-startup.log
            exit 1
          fi

          # Full first-owner POST path, not merely the anonymous form, with
          # the real antiforgery cookie and a disposable CI-only password.
          curl --insecure --silent --cookie-jar /tmp/of-cookies             --cookie /tmp/of-cookies             https://localhost:7117/account/setup -o /tmp/owner-setup.html
          token=$(sed -n "s/.*name='__RequestVerificationToken' value='\([^']*\)'.*/\1/p" /tmp/owner-setup.html)
          if [ -z "$token" ]; then
            echo "Missing setup antiforgery token"
            exit 1
          fi
          setup_code=$(curl --insecure --silent --cookie /tmp/of-cookies             --cookie-jar /tmp/of-cookies --output /dev/null --write-out '%{http_code}'             --data-urlencode "__RequestVerificationToken=$token"             --data-urlencode "email=ci-owner@example.org"             --data-urlencode "password=CiOnlyPassword1234!"             https://localhost:7117/account/setup)
          if [ "$setup_code" != "302" ]; then
            echo "Expected first owner setup POST to redirect, got: $setup_code"
            cat /tmp/outreachflow-startup.log
            exit 1
          fi
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          roots = [Path("."), Path("OutreachFlow")]
          business = next((r / "outreachflow.db" for r in roots
                           if (r / "outreachflow.db").exists()), None)
          auth = next((r / "outreachflow.auth.db" for r in roots
                       if (r / "outreachflow.auth.db").exists()), None)
          assert business and auth, "Expected both local SQLite files"
          with sqlite3.connect(business) as db:
              assert db.execute("select count(*) from Workspaces").fetchone()[0] == 1
              assert db.execute("select count(*) from Prospects").fetchone()[0] == 0
          with sqlite3.connect(auth) as db:
              assert db.execute("select count(*) from AspNetUsers").fetchone()[0] == 1
              assert db.execute("select count(*) from Memberships").fetchone()[0] == 1
          print("PASS: fresh first-owner setup creates one private workspace, no demo prospects")
          PY

  recovery-windows:
    name: Windows recovery & smoke tests
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore OutreachFlow.slnx
      - name: Build
        run: dotnet build OutreachFlow.slnx --no-restore --configuration Release
      - name: Verify backup/restore behavior on Windows
        run: dotnet run --project OutreachFlow.SmokeTests/OutreachFlow.SmokeTests.csproj --configuration Release --no-build
      - name: Verify recovery CLI executable
        run: dotnet run --project OutreachFlow.RecoveryCli/OutreachFlow.RecoveryCli.csproj --configuration Release --no-build -- help
