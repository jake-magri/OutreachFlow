name: Scaffold EF Core migration baseline (one-time audit job)

on:
  push:
    branches:
      - feature/persistence-ef-migrations-baseline
    paths:
      - .github/workflows/scaffold-ef-baseline.yml

permissions:
  contents: read

jobs:
  scaffolding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore EF tool and project packages
        run: |
          dotnet tool restore
          dotnet restore OutreachFlow.slnx
      - name: Generate model-accurate versioned baselines for both contexts
        run: |
          dotnet ef migrations add InitialBusinessSchema --context OutreachDbContext \
            --project OutreachFlow/OutreachFlow.csproj \
            --startup-project OutreachFlow/OutreachFlow.csproj \
            --output-dir Data/Migrations/Business --no-build=false
          dotnet ef migrations add InitialIdentitySchema --context AccountDbContext \
            --project OutreachFlow/OutreachFlow.csproj \
            --startup-project OutreachFlow/OutreachFlow.csproj \
            --output-dir Data/Migrations/Identity --no-build=false
          echo "Generated source:"
          find OutreachFlow/Data/Migrations -type f | sort
      - name: Emit source artifacts for controlled review and commit
        shell: bash
        run: |
          find OutreachFlow/Data/Migrations -name '*.cs' -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            encoded="$(base64 -w0 "$file")"
            printf 'MIGRATION_SOURCE_START:%s:%s:MIGRATION_SOURCE_END\n' "$file" "$encoded"
          done
